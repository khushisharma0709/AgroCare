<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Farm Chatbot | AgroCare</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
  <link href="../css/project.css" rel="stylesheet">
</head>
<body>
  <header class="site-header">
    <nav class="nav">
      <a class="brand" href="../index.html"><i class="fa-solid fa-seedling"></i> AgroCare</a>
      <button class="menu-toggle" aria-label="Open menu"><i class="fa-solid fa-bars"></i></button>
      <div class="nav-links">
        <a href="../index.html#services">Services</a>
        <a href="disease.html">Disease</a>
        <a href="weather.html">Weather</a>
        <a href="policy.html">Policy</a>
      </div>
    </nav>
  </header>

  <section class="page-hero">
    <p class="eyebrow">Farm assistant</p>
    <h1>Chatbot</h1>
    <p>Ask farming questions about crop disease, soil, fertilizer, irrigation, weather, and policies.</p>
  </section>

  <main class="page">
    <section class="chat-card">
      <div id="chat-messages" class="chat-messages">
        <div class="chat-message bot-message">
          Namaste. Main AgroCare chatbot hoon. Aap farming se related question pooch sakte hain.
        </div>
      </div>
      <form id="chatbot-form" class="chat-form">
        <input name="message" type="text" placeholder="Example: meri crop ke leaves yellow ho rahe hain" autocomplete="off" required>
        <button type="submit"><i class="fa-solid fa-paper-plane"></i> Send</button>
      </form>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 AgroCare.</p>
  </footer>
  <script src="../jss/config.js"></script>
  <script src="../jss/project.js"></script>
</body>
</html>
