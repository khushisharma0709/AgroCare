<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact | AgroCare</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
  <link href="../css/project.css" rel="stylesheet">
</head>
<body>
  <header class="site-header">
    <nav class="nav">
      <a class="brand" href="../index.html"><i class="fa-solid fa-seedling"></i> AgroCare</a>
      <button class="menu-toggle" aria-label="Open menu"><i class="fa-solid fa-bars"></i></button>
      <div class="nav-links">
        <a href="../index.html#services">Services</a>
        <a href="about.html">About</a>
        <a href="feedback.html">Feedback</a>
      </div>
    </nav>
  </header>

  <section class="page-hero">
    <p class="eyebrow">Get in touch</p>
    <h1>Contact AgroCare</h1>
    <p>Send a question, project note, or support request. The backend stores your message locally.</p>
  </section>

  <main class="page">
    <form class="form-card" id="contact-form">
      <h2>Contact form</h2>
      <label>Name <input type="text" name="name" required></label>
      <label>Email <input type="email" name="email" required></label>
      <label>Message <textarea name="message" required></textarea></label>
      <button type="submit">Send Message</button>
      <p id="contact-message"></p>
    </form>
  </main>

  <footer>
    <p>&copy; 2026 AgroCare.</p>
  </footer>
  <script src="../jss/project.js"></script>
</body>
</html>
